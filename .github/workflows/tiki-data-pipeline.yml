name: Tiki scheduled data pipeline

on:
  schedule:
    # Cron is UTC; the workflow selects tasks using Asia/Bangkok local time (UTC+7).
    # 03:00 UTC = 10:00 local; 11:00 = 18:00; 14:00 = 21:00;
    # 15:00 = 22:00; 16:00 = 23:00; 19:00 = 02:00 on the next local day.
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline to run manually
        type: choice
        required: true
        default: daily_price
        options:
          - daily_price
          - product
          - review
          - preprocess
          - push

permissions:
  contents: write

jobs:
  crawl-process-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository and Git LFS data
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve scheduled task in Asia/Bangkok time
        id: cadence
        shell: bash
        run: |
          set -euo pipefail
          hour="manual"; day="manual"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            day="$(TZ=Asia/Bangkok date +%d)"

            daily_price=false; product=false; review=false; preprocess=false; push=false
            case "${{ github.event.schedule }}" in
              "0 11 * * *"|"0 14 * * *") daily_price=true ;;
              "0 19 * * *") product=true ;;
              "0 3 * * *") [[ "$day" == "01" ]] && review=true || true ;;
              "0 15 * * *") preprocess=true ;;
              "0 16 * * *") push=true ;;
            esac
            hour="$(TZ=Asia/Bangkok date +%H)"
          else
            mode="${{ inputs.mode }}"
            daily_price=false; product=false; review=false; preprocess=false; push=false
            case "$mode" in
              daily_price) daily_price=true ;;
              product) product=true ;;
              review) review=true ;;
              preprocess) preprocess=true ;;
              push) push=true ;;
            esac
          fi

          echo "daily_price=$daily_price" >> "$GITHUB_OUTPUT"
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "review=$review" >> "$GITHUB_OUTPUT"
          echo "preprocess=$preprocess" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Asia/Bangkok hour=$hour day=$day; tasks: daily_price=$daily_price product=$product review=$review preprocess=$preprocess push=$push"

      - name: Crawl daily price
        if: steps.cadence.outputs.daily_price == 'true'
        run: python 01_craw_data/daily_price/crawl_daily_price.py

      - name: Crawl monthly product snapshot
        if: steps.cadence.outputs.product == 'true'
        timeout-minutes: 350
        run: python 01_craw_data/product/product.py

      - name: Crawl new reviews
        if: steps.cadence.outputs.review == 'true'
        run: python 01_craw_data/review/review.py

      - name: Run all preprocessing
        if: steps.cadence.outputs.preprocess == 'true'
        run: python 02_process_raw_data/run_all_preprocessing.py

      - name: Push new database rows to Supabase
        if: steps.cadence.outputs.push == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "SUPABASE_DB_URL GitHub Actions secret is not configured."
            exit 1
          fi
          python 03_push_to_sql/push_to_sql/push_to_database.py

      - name: Commit updated CSV data and Supabase checkpoint
        if: always()
        shell: bash
        run: |
          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .gitattributes 01_craw_data/daily_price 01_craw_data/product 01_craw_data/review 02_process_raw_data/daily_price 02_process_raw_data/product 02_process_raw_data/review 03_push_to_sql/sync_checkpoint_supabase.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Tiki crawl data"
            git push
          else
            echo "No data changes to commit."
          fi
