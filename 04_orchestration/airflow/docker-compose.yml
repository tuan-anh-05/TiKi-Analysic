name: tiki-local-etl

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/aistor/minio:latest
    command: ["minio", "server", "/mnt/data", "--console-address", ":9001", "--license", "/minio.license"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/mnt/data
      - ./minio.license:/minio.license:ro
    restart: unless-stopped

  airflow-init:
    build:
      context: .
    image: tiki-airflow:local
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Bangkok
      AIRFLOW__CORE__DAGS_FOLDER: /opt/tiki/project/04_orchestration/airflow/dags
      AIRFLOW__WEBSERVER__SHOW_TRIGGER_FORM_IF_NO_PARAMS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-tiki-lake}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?Set SUPABASE_DB_URL in .env}
      TIKI_PROJECT_DIR: /opt/tiki/project
    volumes:
      - ../..:/opt/tiki/project
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Tiki --lastname Admin --role Admin --email admin@localhost || true)

  airflow-webserver:
    image: tiki-airflow:local
    build:
      context: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment: *airflow-environment
    volumes:
      - ../..:/opt/tiki/project
    ports:
      - "127.0.0.1:8080:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    image: tiki-airflow:local
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment: *airflow-environment
    volumes:
      - ../..:/opt/tiki/project
    command: scheduler
    restart: unless-stopped

volumes:
  airflow-db-data:
  minio-data:
